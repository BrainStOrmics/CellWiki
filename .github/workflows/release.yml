name: Windows beta package

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  windows-nsis:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --extra desktop
      - working-directory: frontend
        run: npm ci
      - run: uv run python scripts/sync_version.py --check
      - run: uv run python scripts/build_sidecar.py
      - run: uv run python scripts/smoke_packaged_sidecar.py
      - working-directory: frontend
        run: npm run desktop:build -- --bundles nsis
      - name: Generate release evidence
        run: uv run python scripts/generate_release_manifest.py --require-clean
      - uses: actions/upload-artifact@v4
        with:
          name: agentic-cellwiki-windows-${{ github.ref_name }}
          path: |
            frontend/src-tauri/target/release/bundle/nsis/*.exe
            build/release-manifest.json
          if-no-files-found: error

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cellwiki"
dynamic = ["version"]
description = "A self-maintaining single-cell multi-omics knowledge base"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.16,<2",
    "deepagents==0.6.12",
    "fastapi>=0.116,<1",
    "filelock>=3.18,<4",
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-sqlite>=3.0,<4",
    "markdown-it-py>=3,<4",
    "langchain-core>=1.4.9,<2",
    "langchain-anthropic>=1.4.8,<2",
    "langchain-openai>=1.3.5,<2",
    "keyring>=25,<26",
    "openai>=2.45,<3",
    "pdfplumber>=0.10.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-multipart>=0.0.20,<1",
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "mypy>=1.17,<2",
    "pytest>=7.0.0",
    "ruff>=0.12,<1",
    "types-PyYAML>=6.0,<7",
]
desktop = [
    "pyinstaller>=6.14,<7",
]

[project.scripts]
cellwiki = "cellwiki.product_cli:main"
cellwiki-sidecar = "cellwiki.sidecar:main"

[tool.setuptools.dynamic]
version = { file = ["VERSION"] }

[tool.setuptools.package-data]
"cellwiki.migrations" = ["script.py.mako", "versions/*.py"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["cellwiki*"]

[tool.pytest.ini_options]
testpaths = ["tests"]


[tool.mypy]
# 历史适配层与模型兼容层仍有先于本次清理存在的严格类型问题；
# 退役 CLI 后继续按模块显式忽略，待独立收敛。

[[tool.mypy.overrides]]
# 历史提取/渲染适配层与模型兼容层的既有类型问题先于本次重构存在，
# 不属于产品治理路径；重构完成后再单独收敛。
module = [
    'cellwiki.adapters.*',
    'cellwiki.models',
]
ignore_errors = true

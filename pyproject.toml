[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cellwiki"
version = "2.0.0"
description = "A self-maintaining single-cell multi-omics knowledge base"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
    "pdfplumber>=0.10.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "rich>=13.0.0",
    "tqdm>=4.60.0",
    "requests>=2.28.0",
    "graphviz>=0.20",
    "pyyaml>=6.0",
    "langgraph",
    "langchain-core",
    "langchain-openai",
]

[project.optional-dependencies]
analysis = [
    "networkx",
    "python-louvain",
]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
cellwiki = "cellwiki.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["cellwiki*", "graphs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
